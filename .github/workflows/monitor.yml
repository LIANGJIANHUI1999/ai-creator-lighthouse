name: Monitor
run-name: Lighthouse · ${{ github.event_name }} · ${{ inputs.environment || 'all' }} · ${{ inputs.device || 'all' }}
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # UTC: 01:17 / 13:17 = Asia/Shanghai: 09:17 / 21:17.
    - cron: '17 1,13 * * *'
  workflow_dispatch:
    inputs:
      suite:
        description: Measurement suite (scheduled runs include both)
        type: choice
        options: [lighthouse, editor, all]
        default: lighthouse
      environment:
        description: Target environment
        type: choice
        options: [all, production, staging]
        default: all
      device:
        description: Lighthouse device (editor workflow uses desktop only)
        type: choice
        options: [all, desktop, mobile]
        default: all
      routes:
        description: Comma-separated route IDs; empty measures all pages available in the selected environment
        type: string
        default: ''
      runs:
        description: Samples per page
        type: choice
        options: ['3', '1', '5']
        default: '3'
permissions:
  contents: read
concurrency:
  group: lighthouse-${{ github.event_name == 'pull_request' && github.ref || 'monitor' }}
  cancel-in-progress: false
jobs:
  quality-gate:
    name: Required Quality Gate
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      collect_matrix: ${{ steps.plan.outputs.collect_matrix }}
      lighthouse_devices: ${{ steps.plan.outputs.lighthouse_devices }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Verify code and translations
        run: pnpm verify:session
      - name: Unit and integration tests
        run: pnpm test
      - name: Validate measurement inputs
        id: plan
        env:
          TARGET: ${{ inputs.environment || 'all' }}
          ROUTES: ${{ inputs.routes || '' }}
          RUNS: ${{ inputs.runs || '3' }}
          SUITE: ${{ inputs.suite || 'all' }}
          DEVICE: ${{ inputs.device || 'all' }}
        run: |
          node --input-type=module <<'JS'
          import fs from 'node:fs';
          import { collectionMatrix } from './scripts/lib.mjs';
          const config = JSON.parse(fs.readFileSync('monitor.config.json', 'utf8'));
          if (process.env.SUITE === 'editor' && process.env.ROUTES) throw new Error('routes is only used for Lighthouse; leave empty for suite=editor');
          if (process.env.SUITE === 'editor' && process.env.DEVICE === 'mobile') throw new Error('Editor workflow is desktop-only; choose device=desktop or all');
          const matrix = collectionMatrix(config, { environment: process.env.TARGET, device: process.env.SUITE === 'editor' ? 'desktop' : process.env.DEVICE, routes: process.env.SUITE === 'editor' ? '' : process.env.ROUTES, runs: process.env.RUNS });
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `collect_matrix=${JSON.stringify(matrix)}\nlighthouse_devices=${[...new Set(matrix.include.map(target => target.device))].join(',')}\n`);
          JS
  collect:
    name: Collect · ${{ matrix.environment }} · ${{ matrix.device }}
    needs: quality-gate
    if: github.event_name != 'pull_request' && github.event_name != 'push' && inputs.suite != 'editor'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.quality-gate.outputs.collect_matrix) }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Read pinned Chrome version
        id: browser-version
        run: echo "version=$(node -p 'JSON.parse(require("fs").readFileSync("monitor.config.json")).chromeVersion')" >> "$GITHUB_OUTPUT"
      - uses: browser-actions/setup-chrome@v2
        id: chrome
        with:
          chrome-version: ${{ steps.browser-version.outputs.version }}
          install-dependencies: true
      - name: Collect anonymous cold-cache measurements
        env:
          CHROME_PATH: ${{ steps.chrome.outputs.chrome-path }}
          TARGET: ${{ matrix.environment }}
          ROUTES: ${{ inputs.routes || '' }}
          RUNS: ${{ inputs.runs || '3' }}
          DEVICE: ${{ matrix.device }}
        run: pnpm collect --environment="$TARGET" --device="$DEVICE" --routes="$ROUTES" --runs="$RUNS"
      - name: Archive full reports
        id: archive-reports
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifactPrefix }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/${{ matrix.directory }}/
          retention-days: 30
          if-no-files-found: error
      - name: Retry full report upload
        if: ${{ !cancelled() && steps.archive-reports.outcome == 'failure' }}
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifactPrefix }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/${{ matrix.directory }}/
          retention-days: 30
          if-no-files-found: error
          overwrite: true
  editor-collect:
    name: Editor workflow · ${{ matrix.environment }}
    needs: quality-gate
    if: github.event_name != 'pull_request' && github.event_name != 'push' && (github.event_name == 'schedule' || inputs.suite == 'editor' || inputs.suite == 'all')
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        environment: ${{ fromJSON(inputs.environment == 'production' && '["production"]' || inputs.environment == 'staging' && '["staging"]' || '["production","staging"]') }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Verify unattended browser availability
        run: |
          if command -v ego-browser >/dev/null; then
            echo 'ego-browser is available; this fallback collector must not replace it.'
            exit 1
          fi
          echo 'ego-browser is unavailable on this Linux runner; using pinned Chrome for unattended CI.'
      - name: Read pinned Chrome version
        id: browser-version
        run: echo "version=$(node -p 'JSON.parse(require("fs").readFileSync("monitor.config.json")).chromeVersion')" >> "$GITHUB_OUTPUT"
      - uses: browser-actions/setup-chrome@v2
        id: chrome
        with:
          chrome-version: ${{ steps.browser-version.outputs.version }}
          install-dependencies: true
      - name: Measure isolated editor workflow
        env:
          CHROME_PATH: ${{ steps.chrome.outputs.chrome-path }}
          TARGET: ${{ matrix.environment }}
          RUNS: ${{ inputs.runs || '3' }}
        run: pnpm collect:editor --environment="$TARGET" --runs="$RUNS"
      - name: Archive editor workflow evidence
        id: archive-editor
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: editor-${{ matrix.environment }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/editor-${{ matrix.environment }}/
          retention-days: 30
          if-no-files-found: error
      - name: Retry editor evidence upload
        if: ${{ !cancelled() && steps.archive-editor.outcome == 'failure' }}
        uses: actions/upload-artifact@v4
        with:
          name: editor-${{ matrix.environment }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/editor-${{ matrix.environment }}/
          retention-days: 30
          if-no-files-found: error
          overwrite: true
  publish:
    name: Archive history and build dashboard
    needs: [quality-gate, collect, editor-collect]
    if: ${{ always() && !cancelled() && github.event_name != 'pull_request' && needs.quality-gate.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
      - name: Open history branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if git ls-remote --exit-code --heads origin monitor-data > /dev/null; then
            git fetch origin monitor-data
            git worktree add --detach monitor-data FETCH_HEAD
          else
            tree=$(git mktree < /dev/null)
            initial=$(echo 'Initialize monitoring history' | git commit-tree "$tree")
            git worktree add --detach monitor-data "$initial"
          fi
      - uses: actions/download-artifact@v4
        if: github.event_name != 'push' && inputs.suite != 'editor'
        with:
          pattern: lighthouse-*-${{ github.run_id }}-${{ github.run_attempt }}
          path: incoming
      - uses: actions/download-artifact@v4
        if: github.event_name != 'push' && (github.event_name == 'schedule' || inputs.suite == 'editor' || inputs.suite == 'all')
        with:
          pattern: editor-*-${{ github.run_id }}-${{ github.run_attempt }}
          path: incoming
      - name: Normalize downloaded folders
        env:
          RUN_ID: ${{ github.run_id }}
          ATTEMPT: ${{ github.run_attempt }}
        run: |
          for target in production staging; do
            folder="incoming/lighthouse-$target-$RUN_ID-$ATTEMPT"
            if [ -d "$folder" ]; then mv "$folder" "incoming/$target"; fi
            mobile_folder="incoming/lighthouse-mobile-$target-$RUN_ID-$ATTEMPT"
            if [ -d "$mobile_folder" ]; then mkdir -p incoming/mobile; mv "$mobile_folder" "incoming/mobile/$target"; fi
            editor_folder="incoming/editor-$target-$RUN_ID-$ATTEMPT"
            if [ -d "$editor_folder" ]; then mv "$editor_folder" "incoming/editor-$target"; fi
          done
      - name: Append immutable metric history
        if: github.event_name != 'push' && inputs.suite != 'editor'
        env:
          GITHUB_TOKEN: ${{ github.token }}
          TARGET_ENVIRONMENTS: ${{ inputs.environment == 'production' && 'production' || inputs.environment == 'staging' && 'staging' || 'production,staging' }}
          TARGET_DEVICES: ${{ needs.quality-gate.outputs.lighthouse_devices }}
          TARGET_ROUTES: ${{ inputs.routes || '' }}
          EXPECTED_RUNS: ${{ inputs.runs || '3' }}
        run: node scripts/archive.mjs
      - name: Append editor workflow history
        if: github.event_name != 'push' && (github.event_name == 'schedule' || inputs.suite == 'editor' || inputs.suite == 'all')
        env:
          GITHUB_TOKEN: ${{ github.token }}
          EXPECTED_EDITOR_RUNS: ${{ inputs.runs || '3' }}
          TARGET_ENVIRONMENTS: ${{ inputs.environment == 'production' && 'production' || inputs.environment == 'staging' && 'staging' || 'production,staging' }}
        run: node scripts/editor-archive.mjs
      - name: Record publication-only health
        if: github.event_name == 'push'
        run: |
          mkdir -p artifacts
          echo '{"failed":0,"summaries":[]}' > artifacts/health.json
      - name: Save history without raw report blobs
        run: node scripts/history-git.mjs
      - name: Build static dashboard with latest page reports
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/build.mjs
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - uses: actions/upload-artifact@v4
        with:
          name: monitor-health-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/health.json
          retention-days: 30
  deploy:
    name: Publish dashboard
    needs: [quality-gate, publish]
    if: ${{ !cancelled() && needs.quality-gate.result == 'success' && needs.publish.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy verified dashboard
        id: deployment
        uses: actions/deploy-pages@v4
  collection-health:
    name: Collection health
    needs: [quality-gate, collect, editor-collect, publish, deploy]
    if: ${{ always() && !cancelled() && github.event_name != 'pull_request' && needs.quality-gate.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: monitor-health-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Surface collection failures after reports are published
        env:
          EVENT: ${{ github.event_name }}
          COLLECTION_RESULT: ${{ needs.collect.result }}
          EDITOR_RESULT: ${{ needs.editor-collect.result }}
          SUITE: ${{ inputs.suite || 'all' }}
          PUBLISH_RESULT: ${{ needs.publish.result }}
          DEPLOY_RESULT: ${{ needs.deploy.result }}
        run: |
          node --input-type=module <<'JS'
          import fs from 'node:fs';
          const health = JSON.parse(fs.readFileSync('health.json', 'utf8'));
          const { pipelineHealthy } = await import('./scripts/lib.mjs');
          const healthy = pipelineHealthy(health, { event: process.env.EVENT, collection: process.env.COLLECTION_RESULT, editorCollection: process.env.EDITOR_RESULT, suite: process.env.SUITE, publish: process.env.PUBLISH_RESULT, deploy: process.env.DEPLOY_RESULT });
          if (!healthy) { console.error('Collection or publication incomplete. Available evidence was archived before this check.'); process.exitCode = 1; }
          else console.log('Both collection and publication completed. Inspect metric budgets on the dashboard.');
          JS
