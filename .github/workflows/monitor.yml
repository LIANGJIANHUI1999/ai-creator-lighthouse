name: Monitor
run-name: Lighthouse · ${{ github.event_name }} · ${{ inputs.environment || 'all' }}
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # UTC: 01:17 / 13:17 = Asia/Shanghai: 09:17 / 21:17.
    - cron: '17 1,13 * * *'
  workflow_dispatch:
    inputs:
      environment:
        description: Target environment
        type: choice
        options: [all, production, staging]
        default: all
      routes:
        description: Comma-separated route IDs; empty measures all 8 pages
        type: string
        default: ''
      runs:
        description: Samples per page
        type: choice
        options: ['3', '1', '5']
        default: '3'
permissions:
  contents: read
concurrency:
  group: lighthouse-${{ github.event_name == 'pull_request' && github.ref || 'monitor' }}
  cancel-in-progress: false
jobs:
  quality-gate:
    name: Required Quality Gate
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Verify code and translations
        run: pnpm verify:session
      - name: Unit and integration tests
        run: pnpm test
      - name: Validate measurement inputs
        env:
          TARGET: ${{ inputs.environment || 'all' }}
          ROUTES: ${{ inputs.routes || '' }}
          RUNS: ${{ inputs.runs || '3' }}
        run: |
          node --input-type=module <<'JS'
          import fs from 'node:fs';
          import { selectPlan } from './scripts/lib.mjs';
          const config = JSON.parse(fs.readFileSync('monitor.config.json', 'utf8'));
          const targets = process.env.TARGET === 'all' ? Object.keys(config.environments) : [process.env.TARGET];
          for (const environment of targets) selectPlan(config, { environment, routes: process.env.ROUTES, runs: process.env.RUNS });
          JS
  collect:
    name: Collect · ${{ matrix.environment }}
    needs: quality-gate
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        environment: ${{ fromJSON(inputs.environment == 'production' && '["production"]' || inputs.environment == 'staging' && '["staging"]' || '["production","staging"]') }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Read pinned Chrome version
        id: browser-version
        run: echo "version=$(node -p 'JSON.parse(require("fs").readFileSync("monitor.config.json")).chromeVersion')" >> "$GITHUB_OUTPUT"
      - uses: browser-actions/setup-chrome@v2
        id: chrome
        with:
          chrome-version: ${{ steps.browser-version.outputs.version }}
          install-dependencies: true
      - name: Collect anonymous cold-cache measurements
        env:
          CHROME_PATH: ${{ steps.chrome.outputs.chrome-path }}
          TARGET: ${{ matrix.environment }}
          ROUTES: ${{ inputs.routes || '' }}
          RUNS: ${{ inputs.runs || '3' }}
        run: pnpm collect --environment="$TARGET" --routes="$ROUTES" --runs="$RUNS"
      - name: Archive full reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse-${{ matrix.environment }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/${{ matrix.environment }}/
          retention-days: 30
          if-no-files-found: error
  publish:
    name: Archive history and build dashboard
    needs: [quality-gate, collect]
    if: ${{ always() && !cancelled() && github.event_name != 'pull_request' && needs.quality-gate.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
      - name: Open history branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if git ls-remote --exit-code --heads origin monitor-data > /dev/null; then
            git fetch origin monitor-data
            git worktree add --detach monitor-data FETCH_HEAD
          else
            tree=$(git mktree < /dev/null)
            initial=$(echo 'Initialize monitoring history' | git commit-tree "$tree")
            git worktree add --detach monitor-data "$initial"
          fi
      - uses: actions/download-artifact@v4
        with:
          pattern: lighthouse-*-${{ github.run_id }}-${{ github.run_attempt }}
          path: incoming
      - name: Normalize downloaded folders
        env:
          RUN_ID: ${{ github.run_id }}
          ATTEMPT: ${{ github.run_attempt }}
        run: |
          for target in production staging; do
            folder="incoming/lighthouse-$target-$RUN_ID-$ATTEMPT"
            if [ -d "$folder" ]; then mv "$folder" "incoming/$target"; fi
          done
      - name: Append immutable metric history
        env:
          GITHUB_TOKEN: ${{ github.token }}
          TARGET_ENVIRONMENTS: ${{ inputs.environment == 'production' && 'production' || inputs.environment == 'staging' && 'staging' || 'production,staging' }}
        run: node scripts/archive.mjs
      - name: Save history without raw report blobs
        run: |
          git -C monitor-data add history
          if ! git -C monitor-data diff --cached --quiet; then
            git -C monitor-data commit -m "Record Lighthouse batch $GITHUB_RUN_ID/$GITHUB_RUN_ATTEMPT"
            git -C monitor-data push origin HEAD:monitor-data
          fi
      - name: Build static dashboard with latest page reports
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/build.mjs
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - uses: actions/upload-artifact@v4
        with:
          name: monitor-health-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/health.json
          retention-days: 30
  deploy:
    name: Publish dashboard
    needs: [quality-gate, publish]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy verified dashboard
        id: deployment
        uses: actions/deploy-pages@v4
  collection-health:
    name: Collection health
    needs: [quality-gate, collect, publish, deploy]
    if: ${{ always() && !cancelled() && github.event_name != 'pull_request' && needs.quality-gate.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: monitor-health-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Surface collection failures after reports are published
        env:
          COLLECTION_RESULT: ${{ needs.collect.result }}
          PUBLISH_RESULT: ${{ needs.publish.result }}
          DEPLOY_RESULT: ${{ needs.deploy.result }}
        run: |
          node --input-type=module <<'JS'
          import fs from 'node:fs';
          const health = JSON.parse(fs.readFileSync('health.json', 'utf8'));
          const healthy = !health.failed && [process.env.COLLECTION_RESULT, process.env.PUBLISH_RESULT, process.env.DEPLOY_RESULT].every(result => result === 'success');
          if (!healthy) { console.error('Collection or publication incomplete. Available evidence was archived before this check.'); process.exitCode = 1; }
          else console.log('Both collection and publication completed. Inspect metric budgets on the dashboard.');
          JS
